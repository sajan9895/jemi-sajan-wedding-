<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jemi & Sajan Wedding</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fff0f3;
  font-family: Georgia, serif;
  text-align: center;
  color: #853b50;
}
.card {
  padding: 30px 20px;
  max-width: 340px;
}
.envelope {
  font-size: 100px;
  cursor: pointer;
  animation: float 2s infinite ease-in-out;
}
h1 {
  font-size: 34px;
}
.invitation {
  display: none;
  animation: fade 1.5s ease;
}
button {
  background: #853b50;
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  cursor: pointer;
}
@keyframes float {
  50% { transform: translateY(-10px); }
}
@keyframes fade {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
ß
</style>
</head>
<body>
<div class="card">
  <div id="cover">
    <div class="envelope" onclick="openInvite()">💌</div>
    <p>With love, an invitation for you</p>
    <button onclick="openInvite()">Open Invitation ❤️</button>
  </div>
  <div class="invitation" id="invite">
    <p>YOU ARE CORDIALLY INVITED TO CELEBRATE</p>
    <h1>
  <span id="bride"></span>
  <br>&<br>
  <span id="groom"></span>
    </h1>
    <p>Two hearts, one beautiful journey ❤️</p>
    <p>With love and blessings</p>
  </div>
</div>
<script>
function openInvite() {
  document.getElementById("cover").style.display = "none";
  document.getElementById("invite").style.display = "block";
}
</script>
</body>
</html>
